# Runs the unit tests and the instrumented OCR test on every push and pull request.
#
# Pushes that only change documentation or design files are skipped, and a newer push cancels a
# run still in progress, to save build minutes on the free plan.
name: Tests

on:
  push:
    paths-ignore: ["**.md", "design/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "design/**", "LICENSE"]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :app:testDebugUnitTest
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          retention-days: 7

  instrumented:
    name: Instrumented tests (emulator)
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Generate the OCR test photos
        run: |
          pip install pillow numpy
          python tools/make_ocr_testset.py testset

      - name: Build the app and test APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest

      # Hardware acceleration for the emulator.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb push testset/. /data/local/tmp/testset/
            adb shell am instrument -w com.guidedtour.app.test/androidx.test.runner.AndroidJUnitRunner | tee instrument.txt
            adb logcat -d -s OCR_REPORT:I | tee ocr-report.txt
            grep -q "^OK (" instrument.txt

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: instrumented-test-output
          path: |
            instrument.txt
            ocr-report.txt
          retention-days: 7
